services:
  api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./results:/app/results:ro
      - ./data/pets/processed/val:/app/data/pets/processed/val:ro
  web:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_PROXY: http://api:8000
    depends_on:
      - api
